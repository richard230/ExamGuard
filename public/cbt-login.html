  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: 'var(--primary)',
              secondary: 'var(--secondary)',
              accent: 'var(--accent)'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Montserrat', 'sans-serif']
          }
        }
      }
    }

  <style>
    :root {
      --primary: #1847a6;
      --secondary: #0284c7;
      --accent: #17c3b2;
      --error: #e74c3c;
    }

    /* Fallback logo styling when image is missing/broken */
    .logo.logo-fallback::before {
      content: attr(data-initials);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--primary);
      background: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo.logo-fallback img {
      display: none !important;
    }

    /* Dynamic CSS Variables Background Gradient for Left Panel */
    .cbt-login-side {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 60%, var(--accent) 100%);
    }

    /* Dynamic primary button styles */
    .btn-brand-primary {
      background-color: var(--primary);
      transition: all 0.2s ease-in-out;
    }
    .btn-brand-primary:hover:not(:disabled) {
      filter: brightness(0.9);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 35%, transparent);
    }
    
    .text-brand-primary {
      color: var(--primary);
    }
  </style>
</head>

  <!-- Flowbite JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

  <!-- EXACT INTEGRATION SCRIPT MAINTAINED -->
  <script>
    /*
     * ============================================================
     * EXAMGUARD MULTI-SCHOOL / TENANT CONFIGURATION
     * ============================================================
     *
     * Every school uses the same frontend files.
     *
     * Example:
     *   https://goldlinc-schools-manuh.examguard.com.ng/cbt-login.html
     *
     * The hostname identifies the tenant. We then ask the backend
     * for the real school record and use its MongoDB schoolId for
     * authentication and subsequent pages.
     */

    const API_BASE_URL = "https://examguard-8rxe.onrender.com";
    const SCHOOL_CACHE_KEY = "currentSchoolConfig";
    const SCHOOL_ID_KEY = "schoolId";
    const SCHOOL_SUBDOMAIN_KEY = "schoolSubdomain";
    const STUDENT_TOKEN_KEY = "student_token";

    let currentSchool = null;
    let schoolConfigLoaded = false;

    // ------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function clean(value) {
      return String(value ?? "").trim();
    }

    /*
     * Resolve the tenant from the URL first.
     *
     * Preferred production format:
     *   <school-subdomain>.examguard.com.ng
     *
     * Query/localStorage are retained only as fallbacks so that an
     * already-open school portal does not suddenly lose its tenant.
     */
    function getSchoolSubdomain() {
      const host = window.location.hostname.toLowerCase();

      const examGuardMatch = host.match(
        /^([a-z0-9-]+)\.examguard\.com\.ng$/
      );

      if (examGuardMatch && examGuardMatch[1]) {
        const subdomain = examGuardMatch[1];

        // Do not treat the main site as a school tenant.
        if (!["www", "examguard"].includes(subdomain)) {
          return subdomain;
        }
      }

      // Local/development or fallback access.
      return clean(
        getQueryParam("subdomain") ||
        getQueryParam("schoolSubdomain") ||
        sessionStorage.getItem(SCHOOL_SUBDOMAIN_KEY) ||
        localStorage.getItem(SCHOOL_SUBDOMAIN_KEY)
      );
    }

    /*
     * Only use a schoolId after it has come from a trusted backend
     * school configuration or an existing authenticated school flow.
     *
     * We deliberately DO NOT convert the subdomain into schoolId.
     */
    function getCachedSchoolId() {
      try {
        const cached = JSON.parse(
          localStorage.getItem(SCHOOL_CACHE_KEY) || "null"
        );

        return clean(
          cached?._id ||
          cached?.schoolId ||
          cached?.id
        );
      } catch (_) {
        return clean(localStorage.getItem(SCHOOL_ID_KEY));
      }
    }

    function resolveMediaUrl(url) {
      const value = clean(url);
      if (!value) return "";

      if (/^(https?:|data:|blob:)/i.test(value)) {
        return value;
      }

      if (value.startsWith("//")) {
        return window.location.protocol + value;
      }

      if (value.startsWith("/")) {
        return API_BASE_URL + value;
      }

      return API_BASE_URL + "/" + value;
    }

    function schoolInitials(name) {
      return String(name || "School")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0].toUpperCase())
        .join("") || "SC";
    }

    function setCssColor(variable, value, fallback) {
      const color = clean(value) || fallback;
      document.documentElement.style.setProperty(variable, color);
    }

    // ------------------------------------------------------------
    // Apply school configuration
    // ------------------------------------------------------------

    function applySchoolBranding(school) {
      if (!school || typeof school !== "object") return;

      currentSchool = school;

      const name =
        clean(school.schoolName) ||
        clean(school.name) ||
        "School";

      const logo = resolveMediaUrl(
        school.logoUrl ||
        school.logo ||
        school.schoolLogo ||
        school.branding?.logoUrl ||
        school.branding?.logo
      );

      const primary =
        school.branding?.primaryColor ||
        school.branding?.primary ||
        school.primaryColor ||
        "#1847a6";

      const secondary =
        school.branding?.secondaryColor ||
        school.branding?.secondary ||
        school.secondaryColor ||
        "#0284c7";

      const accent =
        school.branding?.accentColor ||
        school.branding?.accent ||
        school.accentColor ||
        "#17c3b2";

      setCssColor("--primary", primary, "#1847a6");
      setCssColor("--secondary", secondary, "#0284c7");
      setCssColor("--accent", accent, "#17c3b2");

      document.title = "CBT Login | " + name;

      const schoolNameEl = document.getElementById("schoolName");
      if (schoolNameEl) {
        schoolNameEl.textContent = name;
      }

      const logoEl = document.getElementById("schoolLogo");

      if (logoEl) {
        logoEl.onerror = function () {
          this.onerror = null;
          this.style.display = "none";
          this.parentElement.classList.add("logo-fallback");
          this.parentElement.setAttribute(
            "data-initials",
            schoolInitials(name)
          );
        };

        if (logo) {
          logoEl.src = logo;
          logoEl.alt = name + " Logo";
          logoEl.style.display = "block";
          logoEl.parentElement.classList.remove("logo-fallback");
        } else {
          logoEl.removeAttribute("src");
          logoEl.style.display = "none";
          logoEl.parentElement.classList.add("logo-fallback");
          logoEl.parentElement.setAttribute(
            "data-initials",
            schoolInitials(name)
          );
        }
      }

      const email =
        clean(school.email) ||
        clean(school.contactEmail) ||
        clean(school.contact?.email);

      const phone =
        clean(school.phone) ||
        clean(school.phoneNumber) ||
        clean(school.contactPhone) ||
        clean(school.contact?.phone);

      const emailRow = document.getElementById("schoolEmailRow");
      const phoneRow = document.getElementById("schoolPhoneRow");

      if (emailRow) {
        emailRow.style.display = email ? "flex" : "none";
      }

      if (phoneRow) {
        phoneRow.style.display = phone ? "flex" : "none";
      }

      const emailEl = document.getElementById("schoolEmail");
      const phoneEl = document.getElementById("schoolPhone");

      if (emailEl) emailEl.textContent = email;
      if (phoneEl) phoneEl.textContent = phone;

      const motto =
        clean(school.motto) ||
        clean(school.tagline) ||
        clean(school.branding?.motto);

      const subtitle = document.querySelector(
        ".cbt-login-side .subtitle"
      );

      if (subtitle) {
        subtitle.textContent = motto || "CBT Student Login";
      }

      // Persist the actual backend school record.
      try {
        localStorage.setItem(
          SCHOOL_CACHE_KEY,
          JSON.stringify(school)
        );

        const realSchoolId = clean(
          school._id ||
          school.schoolId ||
          school.id
        );

        if (realSchoolId) {
          localStorage.setItem(SCHOOL_ID_KEY, realSchoolId);
        }

        const subdomain = getSchoolSubdomain();

        if (subdomain) {
          localStorage.setItem(
            SCHOOL_SUBDOMAIN_KEY,
            subdomain
          );
          sessionStorage.setItem(
            SCHOOL_SUBDOMAIN_KEY,
            subdomain
          );
        }
      } catch (_) {}
    }

    // ------------------------------------------------------------
    // Backend school configuration
    // ------------------------------------------------------------

    async function fetchSchoolConfiguration() {
      const subdomain = getSchoolSubdomain();

      if (!subdomain) {
        throw new Error(
          "No school portal was detected. Please open your school's ExamGuard portal."
        );
      }

      /*
       * IMPORTANT:
       * The backend receives the subdomain and returns the actual
       * school document. The frontend does not invent school IDs.
       */
      const url =
        API_BASE_URL +
        "/api/schools/config?subdomain=" +
        encodeURIComponent(subdomain);

      const response = await fetch(url, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        credentials: "include"
      });

      let data = {};

      try {
        data = await response.json();
      } catch (_) {}

      if (!response.ok) {
        throw new Error(
          data?.message ||
          data?.error ||
          "Unable to load this school's configuration."
        );
      }

      const school =
        data?.school ||
        data?.data?.school ||
        data?.data ||
        data;

      if (
        !school ||
        typeof school !== "object" ||
        !(
          school._id ||
          school.schoolId ||
          school.id ||
          school.schoolName ||
          school.name
        )
      ) {
        throw new Error(
          "The school configuration returned by the server is invalid."
        );
      }

      return school;
    }

    async function loadSchoolConfiguration() {
      // Show cached branding immediately while the current
      // tenant configuration is being fetched.
      try {
        const cached = JSON.parse(
          localStorage.getItem(SCHOOL_CACHE_KEY) || "null"
        );

        if (cached) {
          applySchoolBranding(cached);
        }
      } catch (_) {}

      const subdomain = getSchoolSubdomain();

      if (!subdomain) {
        showSchoolConfigurationError(
          "This is not a valid school portal URL. Please open your school's ExamGuard portal."
        );
        return false;
      }

      try {
        const school = await fetchSchoolConfiguration();

        applySchoolBranding(school);
        schoolConfigLoaded = true;

        hideSchoolConfigurationError();
        return true;
      } catch (error) {
        console.error(
          "School configuration error:",
          error
        );

        /*
         * A cached configuration is acceptable only if it belongs
         * to the same tenant subdomain. Otherwise do not allow the
         * user to accidentally log into another school's portal.
         */
        let cachedIsSameTenant = false;

        try {
          const cached = JSON.parse(
            localStorage.getItem(SCHOOL_CACHE_KEY) || "null"
          );

          const cachedSubdomain = clean(
            cached?.subdomain ||
            cached?.portalSubdomain ||
            cached?.tenantSubdomain
          );

          cachedIsSameTenant =
            !cachedSubdomain ||
            cachedSubdomain.toLowerCase() ===
              subdomain.toLowerCase();
        } catch (_) {}

        if (!cachedIsSameTenant) {
          currentSchool = null;
          schoolConfigLoaded = false;
        }

        showSchoolConfigurationError(
          error.message ||
          "Unable to load this school's configuration."
        );

        return false;
      }
    }

    function showSchoolConfigurationError(message) {
      const errorMsg =
        document.getElementById("cbtErrorMsg");

      if (!errorMsg) return;

      const textSpan = errorMsg.querySelector("span") || errorMsg;
      textSpan.textContent = message;
      errorMsg.style.display = "flex";
    }

    function hideSchoolConfigurationError() {
      const errorMsg =
        document.getElementById("cbtErrorMsg");

      if (!errorMsg) return;

      const textSpan = errorMsg.querySelector("span") || errorMsg;
      textSpan.textContent = "";
      errorMsg.style.display = "none";
    }

    // ------------------------------------------------------------
    // Password toggle
    // ------------------------------------------------------------

    function togglePw() {
      const pwInput =
        document.getElementById("student-password");

      const pwToggle =
        document.querySelector(".toggle-pw i");

      if (pwInput.type === "password") {
        pwInput.type = "text";

        pwToggle.classList.remove("fa-eye");
        pwToggle.classList.add("fa-eye-slash");
      } else {
        pwInput.type = "password";

        pwToggle.classList.remove("fa-eye-slash");
        pwToggle.classList.add("fa-eye");
      }
    }

    // ------------------------------------------------------------
    // CBT Login
    // ------------------------------------------------------------

    document.addEventListener("DOMContentLoaded", async function () {
      const loginForm =
        document.getElementById("cbtLoginForm");

      const errorMsg =
        document.getElementById("cbtErrorMsg");

      const spinner =
        document.getElementById("cbt-spinner");

      const submitBtn =
        loginForm.querySelector(
          'button[type="submit"]'
        );

      /*
       * Disable login until the tenant has been resolved.
       * This prevents a student from accidentally authenticating
       * against the wrong school.
       */
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";

      const configLoaded =
        await loadSchoolConfiguration();

      submitBtn.disabled = !configLoaded;
      submitBtn.style.opacity =
        configLoaded ? "1" : "0.6";

      if (!configLoaded) {
        return;
      }

      loginForm.addEventListener(
        "submit",
        async function (e) {
          e.preventDefault();

          errorMsg.style.display = "none";
          const textSpan = errorMsg.querySelector("span") || errorMsg;
          textSpan.textContent = "";

          const loginVal =
            document
              .getElementById("student-id")
              .value.trim();

          const password =
            document
              .getElementById("student-password")
              .value.trim();

          if (!loginVal || !password) {
            textSpan.textContent =
              "Please fill in all fields.";

            errorMsg.style.display = "flex";
            return;
          }

          /*
           * The critical multi-school rule:
           * ALWAYS use the schoolId returned by the backend
           * configuration. Never send the subdomain as schoolId.
           */
          const schoolId = clean(
            currentSchool?._id ||
            currentSchool?.schoolId ||
            currentSchool?.id ||
            getCachedSchoolId()
          );

          const schoolSubdomain =
            getSchoolSubdomain();

          if (!schoolId) {
            textSpan.textContent =
              "School configuration is incomplete. Please refresh the page.";

            errorMsg.style.display = "flex";
            return;
          }

          const isEmail =
            loginVal.includes("@");

          const body = isEmail
            ? {
                email: loginVal,
                password,
                schoolId
              }
            : {
                regNo: loginVal,
                password,
                schoolId
              };

          spinner.style.display = "block";
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.6";

          try {
            const res = await fetch(
              API_BASE_URL +
                "/api/auth/login",
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type":
                    "application/json",
                  "Accept":
                    "application/json",
                  "X-School-ID":
                    schoolId,
                  ...(schoolSubdomain
                    ? {
                        "X-School-Subdomain":
                          schoolSubdomain
                      }
                    : {})
                },
                body: JSON.stringify(body)
              }
            );

            let data = {};

            try {
              data = await res.json();
            } catch (_) {
              data = {};
            }

            if (res.ok && data?.token) {
              /*
               * Save only tenant-scoped information needed by the
               * CBT pages. Other pages can reuse currentSchoolConfig.
               */
              localStorage.setItem(
                STUDENT_TOKEN_KEY,
                data.token
              );

              localStorage.setItem(
                SCHOOL_ID_KEY,
                schoolId
              );

              if (schoolSubdomain) {
                localStorage.setItem(
                  SCHOOL_SUBDOMAIN_KEY,
                  schoolSubdomain
                );
              }

              if (data.studentId) {
                localStorage.setItem(
                  "studentId",
                  data.studentId
                );
              }

              if (data.class) {
                localStorage.setItem(
                  "studentClass",
                  data.class
                );
              }

              /*
               * Keep the complete school config available to cbt.html.
               * This means cbt.html can immediately render the same
               * school branding before making its own refresh request.
               */
              if (currentSchool) {
                localStorage.setItem(
                  SCHOOL_CACHE_KEY,
                  JSON.stringify(currentSchool)
                );
              }

              window.location.href =
                "cbt.html";
            } else {
              textSpan.textContent =
                data?.error ||
                data?.message ||
                "Invalid login credentials";

              errorMsg.style.display =
                "flex";
            }
          } catch (err) {
            console.error(
              "CBT login error:",
              err
            );

            textSpan.textContent =
              "Network or server error. Please check your connection and try again.";

            errorMsg.style.display =
              "flex";
          } finally {
            spinner.style.display = "none";

            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
          }
        }
      );
    });
  </script>
</body>
</html>
