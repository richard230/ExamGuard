<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ExamGuard International School| Central Computer Based Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Inter', Arial, sans-serif;
      background: #f7fafd;
      color: #1a2b4b;
      height: 100%;
      overflow: hidden;
    }

    .cbt-main {
      display: flex;
      height: 100vh;
      width: 100vw;
      gap: 0;
    }

    /* ============================================
       SIDEBAR (LEFT)
       ============================================ */
    .cbt-sidebar {
      width: 300px;
      background: white;
      border-right: 1px solid #ddeaff;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
      padding: 20px;
      gap: 16px;
      flex-shrink: 0;
    }

    .cbt-sidebar-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cbt-sidebar-title {
      font-size: 18px;
      font-weight: 700;
      color: #2647a6;
    }

    .cbt-sidebar-subtitle {
      font-size: 13px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cbt-summary {
      background: #f8faff;
      border-radius: 10px;
      border: 1px solid #ddeaff;
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .cbt-avatar {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      flex-shrink: 0;
    }

    .cbt-student-info {
      flex: 1;
      min-width: 0;
    }

    .cbt-student-name {
      font-size: 12px;
      font-weight: 700;
      color: #2647a6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .cbt-student-meta {
      font-size: 11px;
      color: #7f8c8d;
    }

    .cbt-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cbt-stat {
      background: #f8faff;
      border: 1px solid #ddeaff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .cbt-stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #2647a6;
      display: block;
    }

    .cbt-stat-label {
      font-size: 10px;
      color: #7f8c8d;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cbt-timer {
      font-weight: bold;
      font-size: 24px;
      background: #e9f0fe;
      color: #2647a6;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      box-shadow: 0 1px 7px #ddeaff88;
    }

    .cbt-timer.warning {
      background: #fff3cd;
      color: #e67e22;
    }

    .cbt-timer.critical {
      background: #f8d7da;
      color: #e74c3c;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .cbt-question-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cbt-nav-label {
      font-size: 11px;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cbt-question-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .cbt-q-btn {
      aspect-ratio: 1;
      border: 1.5px solid #ddeaff;
      background: white;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #7f8c8d;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-family: 'Courier New', monospace;
    }

    .cbt-q-btn:hover {
      border-color: #2647a6;
      color: #2647a6;
      background: #f0f5ff;
    }

    .cbt-q-btn.answered {
      background: #2647a6;
      color: white;
      border-color: #2647a6;
    }

    .cbt-q-btn.current {
      background: #ffd600;
      color: #22305a;
      border-color: #ffd600;
      box-shadow: 0 0 0 2px rgba(255, 214, 0, 0.3);
    }

    /* ============================================
       MAIN CONTENT AREA
       ============================================ */
    .cbt-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
      min-width: 0;
      min-height: 0;
    }

    .cbt-content-header {
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #ddeaff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .cbt-breadcrumb {
      font-size: 12px;
      color: #7f8c8d;
    }

    .cbt-breadcrumb strong {
      color: #2647a6;
      font-weight: 600;
    }

    .cbt-content-progress {
      font-size: 12px;
      color: #7f8c8d;
      font-weight: 600;
    }

    /* Question Area - KEY: This needs min-height: 0 for flex scrolling */
    .cbt-question-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px;
      gap: 20px;
      min-height: 0;
    }

    .cbt-question-number {
      font-size: 12px;
      font-weight: 700;
      color: #2647a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cbt-question-text {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
      line-height: 1.6;
      word-break: break-word;
    }

    .cbt-question-text img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Options */
    .cbt-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .cbt-option {
      padding: 14px 16px;
      border: 2px solid #ddeaff;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .cbt-option:hover {
      border-color: #2647a6;
      background: #f0f5ff;
      box-shadow: 0 2px 8px rgba(38, 71, 166, 0.1);
    }

    .cbt-option.selected {
      background: #2647a6;
      color: white;
      border-color: #2647a6;
      box-shadow: 0 4px 12px rgba(38, 71, 166, 0.2);
    }

    .cbt-option-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #f0f2f5;
      font-weight: 700;
      color: #2647a6;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .cbt-option.selected .cbt-option-letter {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .cbt-option-content {
      flex: 1;
      min-width: 0;
    }

    .cbt-option img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-top: 8px;
    }

    /* Loader & No Exam */
    .cbt-loader, .cbt-no-exam {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: #7f8c8d;
      font-size: 16px;
      flex: 1;
    }

    .cbt-loader i {
      font-size: 48px;
      color: #2647a6;
      margin-right: 12px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Buttons Area - sticky at bottom */
    .cbt-buttons {
      padding: 16px 24px;
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      background: white;
      border-top: 1px solid #ddeaff;
      flex-shrink: 0;
    }

    .cbt-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .cbt-btn-primary {
      background: #2647a6;
      color: white;
      box-shadow: 0 2px 8px rgba(38, 71, 166, 0.2);
    }

    .cbt-btn-primary:hover:not(:disabled) {
      background: #18308b;
      box-shadow: 0 4px 12px rgba(38, 71, 166, 0.3);
    }

    .cbt-btn-secondary {
      background: #f0f2f5;
      color: #2647a6;
      border: 1px solid #ddeaff;
    }

    .cbt-btn-secondary:hover:not(:disabled) {
      background: #ddeaff;
      border-color: #2647a6;
    }

    .cbt-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Results Section */
    .cbt-result-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px;
      min-height: 0;
    }

    .cbt-result-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .cbt-result-icon {
      font-size: 56px;
      color: #27ae60;
      margin-bottom: 12px;
    }

    .cbt-result-title {
      font-size: 24px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .cbt-result-message {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }

    .cbt-score-card {
      background: linear-gradient(135deg, #2647a6 0%, #1a2f5a 100%);
      color: white;
      padding: 24px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(38, 71, 166, 0.2);
    }

    .cbt-score-value {
      font-size: 44px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .cbt-score-label {
      font-size: 12px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cbt-result-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .cbt-detail-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #ddeaff;
    }

    .cbt-detail-value {
      font-size: 20px;
      font-weight: 700;
      color: #2647a6;
      margin-bottom: 6px;
    }

    .cbt-detail-label {
      font-size: 11px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cbt-result-list {
      margin-bottom: 20px;
    }

    .cbt-result-item {
      background: white;
      padding: 12px;
      border-left: 4px solid #ddeaff;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .cbt-result-item.correct {
      border-left-color: #27ae60;
    }

    .cbt-result-item.incorrect {
      border-left-color: #e74c3c;
    }

    .cbt-result-item-question {
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .cbt-result-item-answer {
      font-size: 12px;
      color: #7f8c8d;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .cbt-result-item-answer strong {
      color: #2c3e50;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .cbt-main {
        flex-direction: column;
      }

      .cbt-sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        height: auto;
        padding: 12px 16px;
        gap: 12px;
        flex-wrap: wrap;
      }

      .cbt-question-grid {
        grid-template-columns: repeat(6, 1fr);
      }

      .cbt-options {
        grid-template-columns: 1fr;
      }

      .cbt-result-details {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .cbt-question-area {
        padding: 16px;
      }

      .cbt-buttons {
        padding: 12px 16px;
        flex-direction: column;
      }

      .cbt-btn {
        width: 100%;
        justify-content: center;
      }

      .cbt-content-header {
        padding: 12px 16px;
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }

      .cbt-question-text {
        font-size: 15px;
      }

      .cbt-timer {
        font-size: 20px;
      }

      .cbt-question-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 480px) {
      .cbt-sidebar {
        flex-direction: column;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #ddeaff;
      }

      .cbt-question-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .cbt-options {
        grid-template-columns: 1fr;
      }

      .cbt-result-details {
        grid-template-columns: 1fr;
      }

      .cbt-score-value {
        font-size: 32px;
      }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f5f7fa;
    }

    ::-webkit-scrollbar-thumb {
      background: #d0d7e0;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #bcc2cc;
    }
  </style>
</head>
<body>
  <div class="cbt-main">
    <!-- SIDEBAR -->
    <aside class="cbt-sidebar">
      <div class="cbt-sidebar-header">
        <div class="cbt-sidebar-title">ExamGuard CBT</div>
        <div class="cbt-sidebar-subtitle">Computer Based Test</div>
      </div>

      <div class="cbt-summary">
        <div class="cbt-avatar"><i class="fa fa-user"></i></div>
        <div class="cbt-student-info">
          <div class="cbt-student-name" id="studentName">Student</div>
          <div class="cbt-student-meta" id="studentClass">Class: -</div>
          <div class="cbt-student-meta" id="cbtSubject">Subject: -</div>
        </div>
      </div>

      <div class="cbt-stats">
        <div class="cbt-stat">
          <span class="cbt-stat-value" id="cbtTotalQuestions">-</span>
          <span class="cbt-stat-label">Total Q</span>
        </div>
        <div class="cbt-stat">
          <span class="cbt-stat-value" id="cbtTotalAnswered">0</span>
          <span class="cbt-stat-label">Answered</span>
        </div>
      </div>

      <div class="cbt-timer" id="cbtTimer">00:00</div>

      <div class="cbt-question-nav">
        <div class="cbt-nav-label">Questions</div>
        <div class="cbt-question-grid" id="cbtQuestionNav"></div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="cbt-content">
      <div class="cbt-content-header">
        <div class="cbt-breadcrumb">
          <strong id="cbtExamTitle">Exam</strong>
        </div>
        <div class="cbt-content-progress">
          Q <strong id="cbtCurrentQuestion">1</strong> / <strong id="cbtTotalQuestionsHeader">-</strong>
        </div>
      </div>

      <!-- LOADER -->
      <div class="cbt-loader" id="cbtExamLoader">
        <i class="fa fa-spinner"></i>
        <span>Loading exam...</span>
      </div>

      <!-- NO EXAM -->
      <div class="cbt-no-exam" id="cbtNoExamArea" style="display: none;">
        <div style="text-align: center;">
          <i class="fas fa-inbox" style="font-size: 48px; color: #bdc3c7; margin-bottom: 16px;"></i>
          <p>No CBT exam is currently scheduled for you.</p>
        </div>
      </div>

      <!-- EXAM AREA -->
      <div id="cbtExamArea" style="display: none;">
        <div class="cbt-question-area">
          <div>
            <div class="cbt-question-number">Question <span id="qNum">1</span></div>
            <div class="cbt-question-text" id="cbtQuestionText"></div>
          </div>
          <div class="cbt-options" id="cbtOptions"></div>
        </div>

        <div class="cbt-buttons">
          <button class="cbt-btn cbt-btn-secondary" id="cbtPrevBtn">
            <i class="fa fa-arrow-left"></i> Previous
          </button>
          <button class="cbt-btn cbt-btn-secondary" id="cbtClearBtn">
            <i class="fa fa-times"></i> Clear
          </button>
          <button class="cbt-btn cbt-btn-primary" id="cbtNextBtn">
            Next <i class="fa fa-arrow-right"></i>
          </button>
          <button class="cbt-btn cbt-btn-primary" id="cbtSubmitBtn">
            <i class="fa fa-check"></i> Submit
          </button>
        </div>
      </div>

      <!-- RESULTS AREA -->
      <div id="cbtResultArea" style="display: none;" class="cbt-result-area">
        <!-- Results rendered here -->
      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = "https://examguard-8rxe.onrender.com";
    const token = localStorage.getItem('student_token') || localStorage.getItem('studentToken') || localStorage.getItem('token');
    
    let student = { name: '', class: '', subject: '', _id: '' };
    let exam = null;
    let startedAt = new Date().toISOString();
    let questions = [];
    let answers = [];
    let currentQ = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    async function logStudentActivity(action, extra = {}) {
      const payload = {
        student: student._id,
        exam: exam._id,
        action: action,
        timestamp: new Date().toISOString(),
        ...extra
      };
      try {
        await fetch(API_BASE_URL + '/api/activity', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': 'Bearer ' + token } : {})
          },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Activity log failed', e);
      }
    }

    async function fetchStudentAndExam() {
      try {
        let studentRes = await fetch(API_BASE_URL + '/api/student/me', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });

        if (!studentRes.ok) {
          document.getElementById('cbtExamLoader').innerHTML = '<span>Failed to load student data. Please login again.</span>';
          return;
        }

        const studentJson = await studentRes.json();
        student.name = studentJson.name || 
          ((studentJson.firstname && studentJson.surname) ? studentJson.firstname + " " + studentJson.surname : "Student Name");
        student.class = 
          (typeof studentJson.class === 'object' && studentJson.class && studentJson.class.name) ? studentJson.class.name :
          (typeof studentJson.class === 'string' ? studentJson.class : '-');
        student._id = studentJson._id;

        let scheduledRes = await fetch(
          API_BASE_URL + '/api/exam/student?status=Scheduled,Started&scheduledFor=student',
          { headers: token ? { 'Authorization': 'Bearer ' + token } : {} }
        );

        let scheduled = [];
        if (scheduledRes.ok) {
          scheduled = await scheduledRes.json();
        }

        if (!Array.isArray(scheduled) || !scheduled.length) {
          showNoExam();
          return;
        }

        exam = scheduled[0];
        questions = Array.isArray(exam.questions) ? exam.questions : [];
        answers = Array(questions.length).fill(null);
        timerSeconds = (exam.duration || 15) * 60;
        currentQ = 0;

        document.getElementById('cbtExamLoader').style.display = 'none';
        document.getElementById('cbtExamArea').style.display = '';

        fillStudentSidebar();
        renderQuestion();
        startTimer();
        logStudentActivity('started');
      } catch (e) {
        console.error('Error fetching exam:', e);
        document.getElementById('cbtExamLoader').innerHTML = '<span>Error loading exam. Please refresh.</span>';
      }
    }

    function showNoExam() {
      document.getElementById('cbtExamLoader').style.display = 'none';
      document.getElementById('cbtNoExamArea').style.display = '';
    }

    function fillStudentSidebar() {
      document.getElementById('studentName').textContent = student.name || 'Student';
      document.getElementById('studentClass').textContent = "Class: " + (student.class || '-');
      document.getElementById('cbtExamTitle').textContent = exam?.subjectName || exam?.subject?.name || 'CBT';
      document.getElementById('cbtSubject').textContent = "Subject: " + (exam?.subjectName || exam?.subject?.name || '-');
      document.getElementById('cbtTotalQuestions').textContent = questions.length;
      document.getElementById('cbtTotalQuestionsHeader').textContent = questions.length;
      updateSidebarStats();

      let navHtml = "";
      for (let i = 0; i < questions.length; i++) {
        let btnClass = "";
        if (i === currentQ) btnClass = "current";
        if (answers[i] !== null) btnClass += " answered";
        navHtml += `<button type="button" class="cbt-q-btn ${btnClass}" onclick="gotoQuestion(${i})" title="Q${i + 1}">${i + 1}</button>`;
      }
      document.getElementById('cbtQuestionNav').innerHTML = navHtml;
    }

    function updateSidebarStats() {
      document.getElementById('cbtTotalAnswered').textContent = answers.filter(a => a !== null).length;
      document.getElementById('cbtCurrentQuestion').textContent = currentQ + 1;
    }

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('qNum').textContent = currentQ + 1;
      document.getElementById('cbtQuestionText').innerHTML = q.text;

      let optsHtml = "";
      (q.options || []).forEach((opt, idx) => {
        let selected = answers[currentQ] === idx ? "selected" : "";
        let optValue = typeof opt === 'string' ? opt : (opt.value || '');
        optsHtml += `
          <div class="cbt-option ${selected}" onclick="selectAnswer(${idx})">
            <div class="cbt-option-letter">${String.fromCharCode(65 + idx)}</div>
            <div class="cbt-option-content">${optValue}</div>
          </div>
        `;
      });
      document.getElementById('cbtOptions').innerHTML = optsHtml;

      document.getElementById('cbtPrevBtn').disabled = currentQ === 0;
      document.getElementById('cbtNextBtn').disabled = currentQ === questions.length - 1;
      document.getElementById('cbtSubmitBtn').disabled = answers.filter(a => a !== null).length !== questions.length;

      fillStudentSidebar();
    }

    window.gotoQuestion = function (qIdx) {
      currentQ = qIdx;
      renderQuestion();
      logStudentActivity('navigated', { questionIndex: qIdx });
    }

    window.selectAnswer = function (idx) {
      answers[currentQ] = idx;
      renderQuestion();
      logStudentActivity('answered', { questionIndex: currentQ, answer: idx });
    }

    document.getElementById('cbtPrevBtn').onclick = function () {
      if (currentQ > 0) {
        currentQ--;
        renderQuestion();
      }
    };

    document.getElementById('cbtNextBtn').onclick = function () {
      if (currentQ < questions.length - 1) {
        currentQ++;
        renderQuestion();
      }
    };

    document.getElementById('cbtClearBtn').onclick = function () {
      answers[currentQ] = null;
      renderQuestion();
    };

    document.getElementById('cbtSubmitBtn').onclick = async function () {
      if (!exam || !student) return;
      if (confirm("Are you sure you want to submit?")) {
        clearInterval(timerInterval);
        await submitExam();
      }
    };

    function formatTimer(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          alert("Time is up! Submitting your test.");
          submitExam();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const timerEl = document.getElementById('cbtTimer');
      timerEl.textContent = formatTimer(timerSeconds);
      
      if (timerSeconds <= 60) {
        timerEl.classList.add('critical');
        timerEl.classList.remove('warning');
      } else if (timerSeconds <= 300) {
        timerEl.classList.add('warning');
        timerEl.classList.remove('critical');
      } else {
        timerEl.classList.remove('warning', 'critical');
      }
    }

    async function submitExam() {
      document.getElementById('cbtExamArea').style.display = 'none';
      document.getElementById('cbtResultArea').style.display = '';
      document.getElementById('cbtResultArea').innerHTML = '<div class="cbt-loader"><i class="fa fa-spinner"></i><span>Submitting answers...</span></div>';

      const payload = {
        exam: exam._id,
        answers,
        student: student._id,
        startedAt: startedAt,
        finishedAt: new Date().toISOString()
      };

      let result = null;
      try {
        const res = await fetch(API_BASE_URL + '/api/result', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': 'Bearer ' + token } : {})
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          result = await res.json();
        }
      } catch (e) {
        console.error('Submit error:', e);
      }

      logStudentActivity('submitted', { answers });
      showResults(result);
    }

    function showResults(result) {
      let correct = 0;
      let total = questions.length;
      let resultHtml = `
        <div class="cbt-result-header">
          <div class="cbt-result-icon">✓</div>
          <div class="cbt-result-title">Test Submitted</div>
          <div class="cbt-result-message">Thank you, <strong>${student.name}</strong>!</div>
        </div>
      `;

      const resultsData = [];

      if (result && result.results && Array.isArray(result.results)) {
        result.results.forEach((q, i) => {
          let isCorrect = q.isCorrect;
          if (isCorrect) correct++;
          resultsData.push({
            question: questions[i]?.text || 'Question ' + (i + 1),
            userAnswer: typeof answers[i] === 'number' ? String.fromCharCode(65 + answers[i]) : 'No Answer',
            correctAnswer: typeof q.correctAnswer === 'number' ? String.fromCharCode(65 + q.correctAnswer) : '-',
            isCorrect: isCorrect
          });
        });
      } else {
        questions.forEach((q, i) => {
          let correctIdx = typeof q.answer === 'number' ? q.answer : (typeof q.answer === 'string' ? q.options.findIndex(o => o.key === q.answer) : null);
          let isCorrect = answers[i] === correctIdx;
          if (isCorrect) correct++;
          resultsData.push({
            question: q.text,
            userAnswer: typeof answers[i] === 'number' ? String.fromCharCode(65 + answers[i]) : 'No Answer',
            correctAnswer: typeof correctIdx === 'number' ? String.fromCharCode(65 + correctIdx) : '-',
            isCorrect: isCorrect
          });
        });
      }

      resultHtml += `
        <div class="cbt-score-card">
          <div class="cbt-score-value">${correct}/${total}</div>
          <div class="cbt-score-label">Your Score</div>
        </div>

        <div class="cbt-result-details">
          <div class="cbt-detail-card">
            <div class="cbt-detail-value">${correct}</div>
            <div class="cbt-detail-label">Correct</div>
          </div>
          <div class="cbt-detail-card">
            <div class="cbt-detail-value">${total - correct}</div>
            <div class="cbt-detail-label">Incorrect</div>
          </div>
          <div class="cbt-detail-card">
            <div class="cbt-detail-value">${Math.round((correct / total) * 100)}%</div>
            <div class="cbt-detail-label">Percentage</div>
          </div>
        </div>

        <div class="cbt-result-list">
      `;

      resultsData.forEach((item, idx) => {
        resultHtml += `
          <div class="cbt-result-item ${item.isCorrect ? 'correct' : 'incorrect'}">
            <div class="cbt-result-item-question"><strong>Q${idx + 1}:</strong> ${item.question}</div>
            <div class="cbt-result-item-answer">
              <div><strong>Your Answer:</strong> ${item.userAnswer}</div>
              <div><strong>Correct:</strong> ${item.correctAnswer} ${item.isCorrect ? '✓' : '✗'}</div>
            </div>
          </div>
        `;
      });

      resultHtml += `
        </div>
        <button class="cbt-btn cbt-btn-primary" id="cbtLogoutBtn" style="margin-top: 16px;">
          <i class="fa fa-sign-out"></i> Log Out
        </button>
      `;

      document.getElementById('cbtResultArea').innerHTML = resultHtml;

      const logoutBtn = document.getElementById('cbtLogoutBtn');
      if (logoutBtn) {
        logoutBtn.onclick = function() {
          localStorage.removeItem('student_token');
          localStorage.removeItem('studentToken');
          localStorage.removeItem('token');
          window.location.href = '/cbt-login.html';
        };
      }
    }

    fetchStudentAndExam();
  </script>
</body>
</html>
