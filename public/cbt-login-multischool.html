<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">CBT Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --primary: #1847a6;
      --accent: #17c3b2;
      --error: #e74c3c;
      --radius: 18px;
      --shadow: 0 4px 24px color-mix(in srgb, var(--primary) 10%, transparent);
      --bg: linear-gradient(120deg, #e6eefe 0%, #b2c6e6 100%);
      --glass-bg: rgba(255,255,255,0.92);
      --glass-border: color-mix(in srgb, var(--primary) 7%, transparent);
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: #1a2b4b;
      min-height: 100vh;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cbt-login-main {
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      display: flex;
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border);
      overflow: hidden;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
    }
    .cbt-login-side {
      background: linear-gradient(135deg, var(--primary) 75%, var(--accent) 100%);
      color: #fff;
      flex: 1.2;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 24px 30px 24px;
    }
    .cbt-login-side .logo {
      width: 84px;
      height: 84px;
      border-radius: 15px;
      background: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
    }
    .cbt-login-side h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      margin-bottom: 16px;
      letter-spacing: 1.2px;
      text-shadow: 0 2px 8px rgba(10,50,150,0.10);
      text-align: center;
    }
    .cbt-login-side .subtitle {
      font-size: 1.08rem;
      font-weight: 500;
      opacity: 0.93;
      margin-bottom: 18px;
      text-align: center;
    }
    .cbt-login-side .fa-laptop-code {
      font-size: 2.1rem;
      opacity: 0.82;
      margin-bottom: 20px;
      margin-top: 6px;
      color: #fff;
    }
    .cbt-login-side .info-row {
      font-size: 1.05rem;
      opacity: 0.97;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      justify-content: center;
    }
    .cbt-login-side .socials {
      margin-top: 20px;
      display: flex;
      gap: 13px;
      justify-content: center;
    }
    .cbt-login-side .socials a {
      color: #fff;
      font-size: 1.22rem;
      opacity: 0.85;
      border-radius: 100px;
      padding: 2px 5px;
      transition: color .14s, opacity .15s;
    }
    .cbt-login-side .socials a:hover {
      opacity: 1;
      color: var(--accent);
      background: rgba(255,255,255,0.15);
    }
    .cbt-login-form-section {
      flex: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .cbt-login-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid var(--glass-border);
      padding: 36px 32px 28px 32px;
      max-width: 370px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .cbt-login-card .icon {
      font-size: 2.3rem;
      color: var(--primary);
      margin-bottom: 8px;
      text-align: center;
      width: 100%;
      opacity: 0.95;
    }
    .cbt-login-card h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.23rem;
      letter-spacing: 0.5px;
      margin-bottom: 19px;
      color: #1a2b4b;
      text-align: center;
    }
    .cbt-login-card label {
      font-size: 1.06rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
      margin-top: 10px;
      display: block;
    }
    .cbt-login-card input[type="text"], .cbt-login-card input[type="password"] {
      width: 100%;
      font-size: 1.09rem;
      border-radius: 9px;
      border: 1.2px solid #dbe2ee;
      padding: 12px 12px;
      background: #f7f9fc;
      margin-bottom: 14px;
      margin-top: 2px;
      box-sizing: border-box;
      transition: border .15s;
    }
    .cbt-login-card input:focus {
      outline: none;
      border-color: var(--primary);
      background: #f1f5fd;
    }
    .cbt-login-card .input-group {
      position: relative;
      width: 100%;
    }
    .cbt-login-card .toggle-pw {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #a3b7ce;
      font-size: 1.13rem;
      cursor: pointer;
      padding: 2px 6px;
      z-index: 2;
      outline: none;
    }
    .cbt-login-card .form-check {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 1.01rem;
      width: 100%;
    }
    .cbt-login-card .form-check-input[type="checkbox"] {
      width: 17px;
      height: 17px;
      border-radius: 4px;
    }
    .cbt-login-card .btn-primary {
      padding: 12px 0;
      background: var(--primary);
      border-radius: 9px;
      border: none;
      font-size: 1.11rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      margin-bottom: 13px;
      margin-top: 6px;
      width: 100%;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 11%, transparent);
      transition: background .18s, box-shadow .18s;
      cursor: pointer;
    }
    .cbt-login-card .btn-primary:active, .cbt-login-card .btn-primary:focus { background: #174e8b; }
    .cbt-login-card .row-links {
      display: flex;
      justify-content: space-between;
      margin-bottom: 13px;
      font-size: 1.01rem;
      gap: 12px;
      width: 100%;
    }
    .cbt-login-card .row-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      opacity: 0.93;
      transition: opacity .15s;
    }
    .cbt-login-card .row-links a:hover { opacity: 1; text-decoration: underline; }
    .cbt-login-card #cbt-spinner {
      display: none;
      text-align: center;
      margin-top: 10px;
      width: 100%;
    }
    .cbt-login-card .error-msg {
      background: #fff4f4;
      color: var(--error);
      border: 1.2px solid #f9caca;
      border-radius: 5px;
      padding: 7px 11px;
      margin-bottom: 10px;
      font-size: 0.97rem;
      display: none;
    }
    @media (max-width: 900px) {
      .cbt-login-main {
        flex-direction: column;
        max-width: 97vw;
        margin: 0 7px;
      }
      .cbt-login-side {
        min-width: 0;
        padding: 35px 7vw 20px 7vw;
        border-radius: 0 0 var(--radius) var(--radius);
      }
      .cbt-login-form-section {
        padding: 0 7vw 20px 7vw;
      }
      .cbt-login-card {
        padding: 28px 7vw 20px 7vw;
        max-width: 100vw;
        border-radius: var(--radius);
      }
    }
    @media (max-width: 600px) {
      .cbt-login-side {
        padding: 24px 2vw 15px 2vw;
      }
      .cbt-login-card {
        padding: 18px 3vw 15px 3vw;
        border-radius: 16px;
      }
    }
    @media (max-width: 440px) {
      .cbt-login-side { padding: 10px 1vw 8px 1vw; }
      .cbt-login-card { padding: 7px 1vw 8px 1vw; }
      .cbt-login-card h2 { font-size: 0.95rem; }
    }

    /* School-logo fallback generated from the tenant's initials. */
    .cbt-login-side .logo.logo-fallback::before {
      content: attr(data-initials);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--primary);
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .cbt-login-side .logo.logo-fallback img {
      display: none !important;
    }

    .cbt-login-card .btn-primary:disabled {
      cursor: not-allowed;
    }

  </style>
</head>
<body>
  <div class="cbt-login-main">
    <!-- Side Panel -->
    <div class="cbt-login-side">
      <div class="logo">
        <img id="schoolLogo" src="" alt="School Logo" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <h1 id="schoolName">School CBT Portal</h1>
      <div class="subtitle">CBT Student Login</div>
      <div><i class="fa fa-laptop-code"></i></div>
      <div class="info-row" id="schoolEmailRow" style="display:none;">
        <i class="fa fa-envelope"></i>
        <span id="schoolEmail"></span>
      </div>
      <div class="info-row" id="schoolPhoneRow" style="display:none;">
        <i class="fa fa-phone"></i>
        <span id="schoolPhone"></span>
      </div>
      <div class="socials">
        <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fab fa-facebook-square"></i></a>
        <a href="https://twitter.com" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
    <!-- Login Form Card -->
    <div class="cbt-login-form-section">
      <div class="cbt-login-card">
        <div class="icon">
          <i class="fa fa-user-graduate"></i>
        </div>
        <h2>CBT Portal Login</h2>
        <form id="cbtLoginForm" autocomplete="on">
          <div class="error-msg" id="cbtErrorMsg"></div>
          <label for="student-id">E-Mail or Reg. No.</label>
          <input type="text" id="student-id" name="student-id" autocomplete="username" placeholder="Enter your email or registration number" required>
          <div class="input-group mb-2">
            <label for="student-password">Password / Access Code</label>
            <input type="password" id="student-password" name="student-password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pw" tabindex="-1" onclick="togglePw()"><i class="fa fa-eye"></i></button>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="keepLoggedIn">
            <label class="form-check-label" for="keepLoggedIn">
              Keep me logged on
            </label>
          </div>
          <button type="submit" class="btn-primary">LOGIN TO CBT</button>
          <div id="cbt-spinner">
            <i class="fa fa-spinner fa-spin" style="font-size: 1.4rem; color: var(--primary);"></i>
          </div>
          <div class="row-links">
            <a href="#">Forgot Password?</a>
            <a href="#">Need Help?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    /*
     * ============================================================
     * EXAMGUARD MULTI-SCHOOL / TENANT CONFIGURATION
     * ============================================================
     *
     * Every school uses the same frontend files.
     *
     * Example:
     *   https://goldlinc-schools-manuh.examguard.com.ng/cbt-login.html
     *
     * The hostname identifies the tenant. We then ask the backend
     * for the real school record and use its MongoDB schoolId for
     * authentication and subsequent pages.
     */

    const API_BASE_URL = "https://examguard-8rxe.onrender.com";
    const SCHOOL_CACHE_KEY = "currentSchoolConfig";
    const SCHOOL_ID_KEY = "schoolId";
    const SCHOOL_SUBDOMAIN_KEY = "schoolSubdomain";
    const STUDENT_TOKEN_KEY = "student_token";

    let currentSchool = null;
    let schoolConfigLoaded = false;

    // ------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function clean(value) {
      return String(value ?? "").trim();
    }

    /*
     * Resolve the tenant from the URL first.
     *
     * Preferred production format:
     *   <school-subdomain>.examguard.com.ng
     *
     * Query/localStorage are retained only as fallbacks so that an
     * already-open school portal does not suddenly lose its tenant.
     */
    function getSchoolSubdomain() {
      const host = window.location.hostname.toLowerCase();

      const examGuardMatch = host.match(
        /^([a-z0-9-]+)\.examguard\.com\.ng$/
      );

      if (examGuardMatch && examGuardMatch[1]) {
        const subdomain = examGuardMatch[1];

        // Do not treat the main site as a school tenant.
        if (!["www", "examguard"].includes(subdomain)) {
          return subdomain;
        }
      }

      // Local/development or fallback access.
      return clean(
        getQueryParam("subdomain") ||
        getQueryParam("schoolSubdomain") ||
        sessionStorage.getItem(SCHOOL_SUBDOMAIN_KEY) ||
        localStorage.getItem(SCHOOL_SUBDOMAIN_KEY)
      );
    }

    /*
     * Only use a schoolId after it has come from a trusted backend
     * school configuration or an existing authenticated school flow.
     *
     * We deliberately DO NOT convert the subdomain into schoolId.
     */
    function getCachedSchoolId() {
      try {
        const cached = JSON.parse(
          localStorage.getItem(SCHOOL_CACHE_KEY) || "null"
        );

        return clean(
          cached?._id ||
          cached?.schoolId ||
          cached?.id
        );
      } catch (_) {
        return clean(localStorage.getItem(SCHOOL_ID_KEY));
      }
    }

    function resolveMediaUrl(url) {
      const value = clean(url);
      if (!value) return "";

      if (/^(https?:|data:|blob:)/i.test(value)) {
        return value;
      }

      if (value.startsWith("//")) {
        return window.location.protocol + value;
      }

      if (value.startsWith("/")) {
        return API_BASE_URL + value;
      }

      return API_BASE_URL + "/" + value;
    }

    function schoolInitials(name) {
      return String(name || "School")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0].toUpperCase())
        .join("") || "SC";
    }

    function setCssColor(variable, value, fallback) {
      const color = clean(value) || fallback;
      document.documentElement.style.setProperty(variable, color);
    }

    // ------------------------------------------------------------
    // Apply school configuration
    // ------------------------------------------------------------

    function applySchoolBranding(school) {
      if (!school || typeof school !== "object") return;

      currentSchool = school;

      const name =
        clean(school.schoolName) ||
        clean(school.name) ||
        "School";

      const logo = resolveMediaUrl(
        school.logoUrl ||
        school.logo ||
        school.schoolLogo ||
        school.branding?.logoUrl ||
        school.branding?.logo
      );

      const primary =
        school.branding?.primaryColor ||
        school.branding?.primary ||
        school.primaryColor ||
        "#1847a6";

      const secondary =
        school.branding?.secondaryColor ||
        school.branding?.secondary ||
        school.secondaryColor ||
        "#0284c7";

      const accent =
        school.branding?.accentColor ||
        school.branding?.accent ||
        school.accentColor ||
        "#17c3b2";

      setCssColor("--primary", primary, "#1847a6");
      setCssColor("--secondary", secondary, "#0284c7");
      setCssColor("--accent", accent, "#17c3b2");

      document.title = "CBT Login | " + name;

      const schoolNameEl = document.getElementById("schoolName");
      if (schoolNameEl) {
        schoolNameEl.textContent = name;
      }

      const logoEl = document.getElementById("schoolLogo");

      if (logoEl) {
        logoEl.onerror = function () {
          this.onerror = null;
          this.style.display = "none";
          this.parentElement.classList.add("logo-fallback");
          this.parentElement.setAttribute(
            "data-initials",
            schoolInitials(name)
          );
        };

        if (logo) {
          logoEl.src = logo;
          logoEl.alt = name + " Logo";
          logoEl.style.display = "block";
          logoEl.parentElement.classList.remove("logo-fallback");
        } else {
          logoEl.removeAttribute("src");
          logoEl.style.display = "none";
          logoEl.parentElement.classList.add("logo-fallback");
          logoEl.parentElement.setAttribute(
            "data-initials",
            schoolInitials(name)
          );
        }
      }

      const email =
        clean(school.email) ||
        clean(school.contactEmail) ||
        clean(school.contact?.email);

      const phone =
        clean(school.phone) ||
        clean(school.phoneNumber) ||
        clean(school.contactPhone) ||
        clean(school.contact?.phone);

      const emailRow = document.getElementById("schoolEmailRow");
      const phoneRow = document.getElementById("schoolPhoneRow");

      if (emailRow) {
        emailRow.style.display = email ? "flex" : "none";
      }

      if (phoneRow) {
        phoneRow.style.display = phone ? "flex" : "none";
      }

      const emailEl = document.getElementById("schoolEmail");
      const phoneEl = document.getElementById("schoolPhone");

      if (emailEl) emailEl.textContent = email;
      if (phoneEl) phoneEl.textContent = phone;

      const motto =
        clean(school.motto) ||
        clean(school.tagline) ||
        clean(school.branding?.motto);

      const subtitle = document.querySelector(
        ".cbt-login-side .subtitle"
      );

      if (subtitle) {
        subtitle.textContent = motto || "CBT Student Login";
      }

      // Persist the actual backend school record.
      try {
        localStorage.setItem(
          SCHOOL_CACHE_KEY,
          JSON.stringify(school)
        );

        const realSchoolId = clean(
          school._id ||
          school.schoolId ||
          school.id
        );

        if (realSchoolId) {
          localStorage.setItem(SCHOOL_ID_KEY, realSchoolId);
        }

        const subdomain = getSchoolSubdomain();

        if (subdomain) {
          localStorage.setItem(
            SCHOOL_SUBDOMAIN_KEY,
            subdomain
          );
          sessionStorage.setItem(
            SCHOOL_SUBDOMAIN_KEY,
            subdomain
          );
        }
      } catch (_) {}
    }

    // ------------------------------------------------------------
    // Backend school configuration
    // ------------------------------------------------------------

    async function fetchSchoolConfiguration() {
      const subdomain = getSchoolSubdomain();

      if (!subdomain) {
        throw new Error(
          "No school portal was detected. Please open your school's ExamGuard portal."
        );
      }

      /*
       * IMPORTANT:
       * The backend receives the subdomain and returns the actual
       * school document. The frontend does not invent school IDs.
       */
      const url =
        API_BASE_URL +
        "/api/schools/config?subdomain=" +
        encodeURIComponent(subdomain);

      const response = await fetch(url, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        credentials: "include"
      });

      let data = {};

      try {
        data = await response.json();
      } catch (_) {}

      if (!response.ok) {
        throw new Error(
          data?.message ||
          data?.error ||
          "Unable to load this school's configuration."
        );
      }

      const school =
        data?.school ||
        data?.data?.school ||
        data?.data ||
        data;

      if (
        !school ||
        typeof school !== "object" ||
        !(
          school._id ||
          school.schoolId ||
          school.id ||
          school.schoolName ||
          school.name
        )
      ) {
        throw new Error(
          "The school configuration returned by the server is invalid."
        );
      }

      return school;
    }

    async function loadSchoolConfiguration() {
      // Show cached branding immediately while the current
      // tenant configuration is being fetched.
      try {
        const cached = JSON.parse(
          localStorage.getItem(SCHOOL_CACHE_KEY) || "null"
        );

        if (cached) {
          applySchoolBranding(cached);
        }
      } catch (_) {}

      const subdomain = getSchoolSubdomain();

      if (!subdomain) {
        showSchoolConfigurationError(
          "This is not a valid school portal URL. Please open your school's ExamGuard portal."
        );
        return false;
      }

      try {
        const school = await fetchSchoolConfiguration();

        applySchoolBranding(school);
        schoolConfigLoaded = true;

        hideSchoolConfigurationError();
        return true;
      } catch (error) {
        console.error(
          "School configuration error:",
          error
        );

        /*
         * A cached configuration is acceptable only if it belongs
         * to the same tenant subdomain. Otherwise do not allow the
         * user to accidentally log into another school's portal.
         */
        let cachedIsSameTenant = false;

        try {
          const cached = JSON.parse(
            localStorage.getItem(SCHOOL_CACHE_KEY) || "null"
          );

          const cachedSubdomain = clean(
            cached?.subdomain ||
            cached?.portalSubdomain ||
            cached?.tenantSubdomain
          );

          cachedIsSameTenant =
            !cachedSubdomain ||
            cachedSubdomain.toLowerCase() ===
              subdomain.toLowerCase();
        } catch (_) {}

        if (!cachedIsSameTenant) {
          currentSchool = null;
          schoolConfigLoaded = false;
        }

        showSchoolConfigurationError(
          error.message ||
          "Unable to load this school's configuration."
        );

        return false;
      }
    }

    function showSchoolConfigurationError(message) {
      const errorMsg =
        document.getElementById("cbtErrorMsg");

      if (!errorMsg) return;

      errorMsg.textContent = message;
      errorMsg.style.display = "block";
    }

    function hideSchoolConfigurationError() {
      const errorMsg =
        document.getElementById("cbtErrorMsg");

      if (!errorMsg) return;

      errorMsg.textContent = "";
      errorMsg.style.display = "none";
    }

    // ------------------------------------------------------------
    // Password toggle
    // ------------------------------------------------------------

    function togglePw() {
      const pwInput =
        document.getElementById("student-password");

      const pwToggle =
        document.querySelector(".toggle-pw i");

      if (pwInput.type === "password") {
        pwInput.type = "text";

        pwToggle.classList.remove("fa-eye");
        pwToggle.classList.add("fa-eye-slash");
      } else {
        pwInput.type = "password";

        pwToggle.classList.remove("fa-eye-slash");
        pwToggle.classList.add("fa-eye");
      }
    }

    // ------------------------------------------------------------
    // CBT Login
    // ------------------------------------------------------------

    document.addEventListener("DOMContentLoaded", async function () {
      const loginForm =
        document.getElementById("cbtLoginForm");

      const errorMsg =
        document.getElementById("cbtErrorMsg");

      const spinner =
        document.getElementById("cbt-spinner");

      const submitBtn =
        loginForm.querySelector(
          'button[type="submit"]'
        );

      /*
       * Disable login until the tenant has been resolved.
       * This prevents a student from accidentally authenticating
       * against the wrong school.
       */
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";

      const configLoaded =
        await loadSchoolConfiguration();

      submitBtn.disabled = !configLoaded;
      submitBtn.style.opacity =
        configLoaded ? "1" : "0.6";

      if (!configLoaded) {
        return;
      }

      loginForm.addEventListener(
        "submit",
        async function (e) {
          e.preventDefault();

          errorMsg.style.display = "none";
          errorMsg.textContent = "";

          const loginVal =
            document
              .getElementById("student-id")
              .value.trim();

          const password =
            document
              .getElementById("student-password")
              .value.trim();

          if (!loginVal || !password) {
            errorMsg.textContent =
              "Please fill in all fields.";

            errorMsg.style.display = "block";
            return;
          }

          /*
           * The critical multi-school rule:
           * ALWAYS use the schoolId returned by the backend
           * configuration. Never send the subdomain as schoolId.
           */
          const schoolId = clean(
            currentSchool?._id ||
            currentSchool?.schoolId ||
            currentSchool?.id ||
            getCachedSchoolId()
          );

          const schoolSubdomain =
            getSchoolSubdomain();

          if (!schoolId) {
            errorMsg.textContent =
              "School configuration is incomplete. Please refresh the page.";

            errorMsg.style.display = "block";
            return;
          }

          const isEmail =
            loginVal.includes("@");

          const body = isEmail
            ? {
                email: loginVal,
                password,
                schoolId
              }
            : {
                regNo: loginVal,
                password,
                schoolId
              };

          spinner.style.display = "block";
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.6";

          try {
            const res = await fetch(
              API_BASE_URL +
                "/api/auth/login",
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type":
                    "application/json",
                  "Accept":
                    "application/json",
                  "X-School-ID":
                    schoolId,
                  ...(schoolSubdomain
                    ? {
                        "X-School-Subdomain":
                          schoolSubdomain
                      }
                    : {})
                },
                body: JSON.stringify(body)
              }
            );

            let data = {};

            try {
              data = await res.json();
            } catch (_) {
              data = {};
            }

            if (res.ok && data?.token) {
              /*
               * Save only tenant-scoped information needed by the
               * CBT pages. Other pages can reuse currentSchoolConfig.
               */
              localStorage.setItem(
                STUDENT_TOKEN_KEY,
                data.token
              );

              localStorage.setItem(
                SCHOOL_ID_KEY,
                schoolId
              );

              if (schoolSubdomain) {
                localStorage.setItem(
                  SCHOOL_SUBDOMAIN_KEY,
                  schoolSubdomain
                );
              }

              if (data.studentId) {
                localStorage.setItem(
                  "studentId",
                  data.studentId
                );
              }

              if (data.class) {
                localStorage.setItem(
                  "studentClass",
                  data.class
                );
              }

              /*
               * Keep the complete school config available to cbt.html.
               * This means cbt.html can immediately render the same
               * school branding before making its own refresh request.
               */
              if (currentSchool) {
                localStorage.setItem(
                  SCHOOL_CACHE_KEY,
                  JSON.stringify(currentSchool)
                );
              }

              window.location.href =
                "cbt.html";
            } else {
              errorMsg.textContent =
                data?.error ||
                data?.message ||
                "Invalid login credentials";

              errorMsg.style.display =
                "block";
            }
          } catch (err) {
            console.error(
              "CBT login error:",
              err
            );

            errorMsg.textContent =
              "Network or server error. Please check your connection and try again.";

            errorMsg.style.display =
              "block";
          } finally {
            spinner.style.display = "none";

            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
          }
        }
      );
    });
  </script>
</body>
</html>
